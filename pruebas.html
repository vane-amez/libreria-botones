<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas.</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>Prueba de botones.</h1>
    <button class="btn-primary btn-pill btn-shadow-soft btn-lift">
        Combinación 1.
    </button>

    <button class="btn-secondary btn-outline btn-elegant btn-hover-underline">
        Combinación 2.
    </button>

    <button class="btn-custom btn-gradient-diagonal btn-bold btn-glow-pulse">
        Combinación 3.
    </button>

    <button class="btn-download btn-rounded btn-shadow-color btn-grow">
        📥 Descargar ahora.
    </button>

    <button class="btn-dark btn-glass btn-rainbow-border btn-transition-slow">
        Combinación 5.
    </button>

</body>

</html>
